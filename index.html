<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobWare</title>
<meta name="description" content="BobWare: gaming scripts and tools. First out: BobWare Clicker, a humanized auto clicker with multiple keybind profiles.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,3 27,16 16,29 5,16' fill='%237c5cff'/%3E%3Cpolygon points='16,3 27,16 16,16' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#top">
      <svg class="brand-gem" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
        <polygon points="16,3 27,16 16,29 5,16" fill="var(--accent)"/>
        <polygon points="16,3 27,16 16,16" fill="var(--accent2)"/>
      </svg>
      <span>BobWare</span>
    </a>
  </div>
</header>

<main id="top">

  <section class="hero wrap">
    <svg class="hero-gem" viewBox="0 0 32 32" width="52" height="52" aria-hidden="true">
      <polygon points="16,3 27,16 16,29 5,16" fill="var(--accent)"/>
      <polygon points="16,3 27,16 16,16" fill="var(--accent2)"/>
    </svg>
    <p class="tagline">Gaming scripts &amp; tools.</p>
    <a class="btn btn-primary" href="https://github.com/Bobbandus/bobware/releases/latest" target="_blank" rel="noopener">Download BobWare</a>
  </section>

  <section class="launchpad" id="apps">
    <div class="launchpad-sheet">
      <div class="launchpad-grid">
        <a class="app-tile" href="clicker.html">
          <span class="app-icon">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" aria-hidden="true">
              <polygon points="4,3 4,15.5 7.3,12.7 11.5,20.5 14.3,19 10.3,11.5 16,11.5" fill="var(--accent)"/>
              <path d="M17,4 19,2 M20,8 22.5,7.3 M18.5,11 21,12" stroke="var(--accent2)" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span>BobWare Clicker</span>
        </a>
        <a class="app-tile" href="Projects.html">
          <span class="app-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
              <rect x="10.2" y="3" width="3.6" height="18" rx="1.8" fill="var(--accent)"/>
              <rect x="3" y="10.2" width="18" height="3.6" rx="1.8" fill="var(--accent2)"/>
            </svg>
          </span>
          <span>Projects</span>
        </a>
        <div class="app-tile app-tile-locked" aria-disabled="true">
          <span class="app-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" stroke="var(--muted)" stroke-width="1.6"/>
              <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="12" cy="16" r="1.3" fill="var(--muted)"/>
            </svg>
          </span>
          <span>Locked</span>
        </div>
        <div class="app-tile app-tile-locked" aria-disabled="true">
          <span class="app-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" stroke="var(--muted)" stroke-width="1.6"/>
              <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="12" cy="16" r="1.3" fill="var(--muted)"/>
            </svg>
          </span>
          <span>Locked</span>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p class="watermark">Built by Bobbandus</p>
  <p class="fineprint">Not tuned to evade anti-cheat. Use only where auto clicking is allowed.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
